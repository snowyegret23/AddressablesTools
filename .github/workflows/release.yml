name: Release commit

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build, smoke-test and package
        env:
          RELEASE_DIR: ${{ runner.temp }}/addressables-release
          RUNTIME_ID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_SHA.Substring(0, 12)
          New-Item -Path $env:RELEASE_DIR -ItemType Directory -Force | Out-Null
          $packages = @(
            @{ Mode = 'framework-dependent'; SelfContained = 'false' }
            @{ Mode = 'self-contained'; SelfContained = 'true' }
          )
          foreach ($package in $packages) {
            $name = "net8.0-$env:RUNTIME_ID-$($package.Mode)"
            $publishDir = Join-Path $env:RELEASE_DIR $name
            dotnet publish Example/Example.csproj -c Release -f net8.0 -r $env:RUNTIME_ID --self-contained $package.SelfContained -o $publishDir -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $name" }
            $executable = if ($IsWindows) { 'Example.exe' } else { 'Example' }
            $output = & (Join-Path $publishDir $executable)
            if ($LASTEXITCODE -ne 0) { throw "Smoke test failed for $name" }
            $output | Write-Output
            if ($output -notcontains 'modes: searchasset, patchcrc') { throw "Unexpected CLI output for $name" }
            $runtimeLibrary = if ($IsWindows) { 'coreclr.dll' } else { 'libcoreclr.so' }
            if ($package.SelfContained -eq 'true' -and -not (Test-Path -LiteralPath (Join-Path $publishDir $runtimeLibrary))) {
              throw "The self-contained package is missing the .NET runtime: $name"
            }
            Copy-Item -LiteralPath readme.txt -Destination $publishDir
            if ($IsWindows) {
              $archive = Join-Path $env:RELEASE_DIR "AddressablesTools-$tag-$name.zip"
              Compress-Archive -Path "$publishDir/*" -DestinationPath $archive -CompressionLevel Optimal
            } else {
              $archive = Join-Path $env:RELEASE_DIR "AddressablesTools-$tag-$name.tar.gz"
              tar -czf $archive -C $publishDir .
              if ($LASTEXITCODE -ne 0) { throw "Packaging failed for $name" }
            }
          }

      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/addressables-release/AddressablesTools-*.zip
            ${{ runner.temp }}/addressables-release/AddressablesTools-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/addressables-release

      - name: Publish the commit release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/addressables-release
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_SHA.Substring(0, 12)
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          function Get-OptionalGitHubResource($path) {
            try {
              Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/$path" -Headers $headers
            } catch {
              if ($null -eq $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
              return $null
            }
          }

          $tagRef = Get-OptionalGitHubResource "git/ref/tags/$tag"
          if ($null -ne $tagRef -and ($tagRef.object.type -ne 'commit' -or $tagRef.object.sha -ne $env:GITHUB_SHA)) {
            throw "Tag $tag already exists and does not point directly to $env:GITHUB_SHA"
          }
          $release = Get-OptionalGitHubResource "releases/tags/$tag"
          if ($null -ne $release) {
            if (-not $release.draft) {
              if ($null -eq $tagRef) { throw "Published release $tag has no matching tag" }
              Write-Output "Release $tag is already published; leaving it unchanged."
              return
            }
            if ($null -eq $tagRef -and $release.target_commitish -ne $env:GITHUB_SHA) {
              throw "Draft release $tag targets a different commit"
            }
          }

          $assets = foreach ($rid in @('win-x64', 'linux-x64')) {
            $extension = if ($rid -eq 'win-x64') { 'zip' } else { 'tar.gz' }
            foreach ($mode in @('framework-dependent', 'self-contained')) {
              $asset = Join-Path $env:RELEASE_DIR "AddressablesTools-$tag-net8.0-$rid-$mode.$extension"
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
              $asset
            }
          }
          if ($null -eq $release) {
            $notes = "Automated build of commit $env:GITHUB_SHA.`n`nWindows x64 and Linux x64 packages include the Example CLI and AddressablesTools library.`n`nRecommended: self-contained packages include the .NET runtime. Extract the archive and run Example.exe (Windows) or ./Example (Linux); no .NET installation is required. The smaller framework-dependent packages require the .NET 8 x64 runtime.`n`nRun without arguments for usage. Commands: searchasset and patchcrc."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AddressablesTools $tag" --notes $notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; the release remains a draft' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }
